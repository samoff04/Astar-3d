<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A* 3D Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside>
  <h1>A* Search in 3D</h1>
  <div class="sub">f(n) = g(n) + h(n). Enter your graph, then watch it search.</div>
  <label>Nodes: one per line as "name h-value"</label>
  <textarea id="nodes" spellcheck="false">S 7
A 6
B 4
C 2
D 1
G 0</textarea>
  <label>Edges: one per line as "from to cost" (undirected)</label>
  <textarea id="edges" spellcheck="false">S A 1
S B 4
A B 2
A C 5
B C 2
B D 5
C G 3
D G 2</textarea>
  <div class="row">
    <div><label>Start</label><input type="text" id="start" value="S"></div>
    <div><label>Goal</label><input type="text" id="goal" value="G"></div>
  </div>
  <div class="btns">
    <button id="build">Build graph</button>
    <button id="run" class="alt">Run</button>
    <button id="stepb" class="alt">Step</button>
    <button id="reset" class="alt">Reset</button>
  </div>
  <label>Speed (slow to fast)</label>
  <input type="range" id="speed" min="1" max="10" value="3" style="width:100%">
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="auto"> Auto-rotate (drag to rotate, scroll to zoom)</label>
  <div id="msg"></div>
  <div id="result"></div>
  <h2>Open list (sorted by f)</h2><div class="box" id="openbox">-</div>
  <h2>Closed list</h2><div class="box" id="closedbox">-</div>
  <h2>Step log</h2><div class="box" id="log">-</div>
</aside>
<div id="view">
  <div class="legend">
    <span><i style="background:#22c55e"></i>start</span><span><i style="background:#ef4444"></i>goal</span>
    <span><i style="background:#f59e0b"></i>open</span><span><i style="background:#3b82f6"></i>closed</span>
    <span><i style="background:#fde047"></i>current</span><span><i style="background:#facc15"></i>final path</span>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
